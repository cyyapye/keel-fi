packages:
  - apps/*
  - packages/*
  - connectors/*

allowBuilds:
  esbuild: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20261110.2-beta
  - wrangler@4.161.0

# Remove when these consumers support patched minimatch directly.
overrides:
  "eslint>minimatch": "11.0.8"
  "@eslint/config-array>minimatch": "11.0.8"
  "@typescript-eslint/typescript-estree>minimatch": "11.0.8"
