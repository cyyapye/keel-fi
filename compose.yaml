name: keel-dev

x-runtime: &runtime
  build:
    context: .
    dockerfile: Dockerfile.dev
  init: true
  restart: unless-stopped
  working_dir: /workspace
  volumes:
    - keel_wrangler_state:/workspace/.keel-local/scenarios
    - ./apps/api/src:/workspace/apps/api/src:ro
    - ./apps/api/wrangler.jsonc:/workspace/apps/api/wrangler.jsonc:ro
    - ./apps/web/index.html:/workspace/apps/web/index.html:ro
    - ./apps/web/src:/workspace/apps/web/src:ro
    - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
    - ./packages/connectors/src:/workspace/packages/connectors/src:ro
    - ./packages/database/migrations:/workspace/packages/database/migrations:ro
    - ./packages/database/seed:/workspace/packages/database/seed:ro
    - ./packages/database/src:/workspace/packages/database/src:ro
    - ./packages/domain/src:/workspace/packages/domain/src:ro
    - ./packages/evidence/src:/workspace/packages/evidence/src:ro
    - ./packages/ui/src:/workspace/packages/ui/src:ro
    - ./scripts:/workspace/scripts:ro

services:
  api:
    <<: *runtime
    environment:
      CHOKIDAR_USEPOLLING: "true"
      KEEL_LOCAL_SCENARIO: default
      WRANGLER_LOG_PATH: /workspace/.keel-local/scenarios/default/logs/wrangler.log
    command:
      - /bin/sh
      - -ec
      - |
        pnpm db:seed:local
        exec pnpm --filter @keel/api exec wrangler dev --env local --ip 0.0.0.0 --port 13246 --persist-to /workspace/.keel-local/scenarios/default
    ports:
      - "127.0.0.1:13246:13246"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:13246/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    <<: *runtime
    environment:
      CHOKIDAR_USEPOLLING: "true"
      KEEL_API_ORIGIN: http://api:13246
    command:
      - pnpm
      - --filter
      - "@keel/web"
      - exec
      - vite
      - --host
      - 0.0.0.0
      - --port
      - "13247"
      - --strictPort
    ports:
      - "127.0.0.1:13247:13247"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:13247/').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  keel_wrangler_state:
