name: Upload bounded artifact
description: Check explicit files and repository capacity before any upload.
inputs:
  kind:
    description: receipt, diagnostics, backup or release
    required: true
  name:
    description: Unique artifact name
    required: true
  path:
    description:
      One to four explicit files, relative to the checkout or absolute
    required: true
  status:
    description: Job status before packaging/upload
    required: true
runs:
  using: composite
  steps:
    - name: Explain temporary artifact pause
      if: ${{ always() && vars.KEEL_PAUSE_ARTIFACT_UPLOADS == 'true' }}
      shell: bash
      env:
        ARTIFACT_KIND: ${{ inputs.kind }}
      run: |
        if [[ "$ARTIFACT_KIND" == backup || "$ARTIFACT_KIND" == release ]]; then
          echo 'Required backup/release storage is paused; deployment must wait.' >&2
          exit 1
        fi
        echo 'Artifact uploads temporarily paused. Checks still run; the complete receipt travels through job outputs. Downloadable diagnostics are unavailable. Preview deployments wait for backup storage to resume.' >> "$GITHUB_STEP_SUMMARY"
    - name: Enforce payload, retention and repository storage budgets
      if: ${{ always() && vars.KEEL_PAUSE_ARTIFACT_UPLOADS != 'true' }}
      id: budget
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        ARTIFACT_KIND: ${{ inputs.kind }}
        ARTIFACT_STATUS: ${{ inputs.status }}
        ARTIFACT_PATHS: ${{ inputs.path }}
        GITHUB_TOKEN: ${{ github.token }}
      run: pnpm exec tsx scripts/ci-artifact-budget.ts
    - uses: actions/upload-artifact@v4
      if:
        ${{ always() && vars.KEEL_PAUSE_ARTIFACT_UPLOADS != 'true' &&
        steps.budget.outcome == 'success' }}
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.budget.outputs.paths }}
        retention-days: ${{ steps.budget.outputs.retention-days }}
        include-hidden-files: true
        if-no-files-found: error
        compression-level:
          ${{ (inputs.kind == 'backup' || inputs.kind == 'diagnostics') && '0'
          || '9' }}
