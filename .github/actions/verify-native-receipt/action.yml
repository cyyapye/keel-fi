name: Verify native receipt
description:
  Validate complete evidence from this workflow attempt without rerunning native
  suites.
inputs:
  receipt:
    description: Validated receipt output from the native job in this attempt
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: cyyapye/tugling
        ref: 2c4f93263e4d99ad4b8a0cb32093161b45264be4
        path: tugling-candidate
        persist-credentials: false
    - name: Validate exact revision, environment, attempt and required coverage
      shell: bash
      working-directory: keel
      env:
        NATIVE_RECEIPT: ${{ inputs.receipt }}
        TUGLING_PILOT_SOURCE: ${{ github.workspace }}/tugling-candidate
        TUGLING_VERIFICATION_ENVIRONMENT: keel-gh-ubuntu24-x64-node22.13.0-pnpm11.9.0-parallel-v8
      run: python3 -I scripts/ci-verification.py check
