name: Bug report
description: Report a reproducible defect using synthetic data only.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never include real financial data, documents, identifiers, credentials,
        or private deployment details. Use fabricated reproduction values.
        Report security issues privately through SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest fabricated example and exact commands.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The affected Git commit.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I confirm this issue contains synthetic data only.
          required: true
        - label: This is not a vulnerability report.
          required: true
