name: Render approved exposure baselines
on:
  push:
    branches: [codex/closing-price-linux-baselines]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      KEEL_SCREENSHOT_MODE: canonical
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
      - name: Prepare canonical browser and synthetic fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID-$VERSION_ID" = ubuntu-24.04
          make bootstrap-ci
          pnpm exec playwright install-deps chromium
          node --version
          pnpm --version
          pnpm exec playwright --version
          make build
          python3 -I scripts/pilot_native.py migration-seed
          python3 -I scripts/pilot_native.py browser-fixture
      - name: Render and replay synthetic Holdings and Watch screens
        run: |
          set -euo pipefail
          for mode in reference changed none; do
            root="$PWD/.keel-local/e2e-lanes"
            if [[ -d "$root" ]]; then mv "$root" "$PWD/.keel-local/prior-$mode"; fi
            mkdir -p "$root/mocked" "$root/mocked-development"
            cp -a .keel-local/pilot-browser-seed "$root/stateful-source"
            cp -a .keel-local/pilot-browser-seed "$root/stateful-b"
            if [[ "$mode" == reference ]]; then
              KEEL_E2E_ISOLATED=1 KEEL_BROWSER_LANE=stateful-source KEEL_LOCAL_PERSIST_TO="$root/stateful-source" pnpm exec playwright test --reporter=list --grep 'App Access keeps scope' --update-snapshots=none e2e/ui-catalogue.visual.spec.ts
              continue
            fi
            KEEL_E2E_ISOLATED=1 KEEL_BROWSER_LANE=stateful-b KEEL_LOCAL_PERSIST_TO="$root/stateful-b" pnpm exec playwright test --reporter=list --update-snapshots="$mode" e2e/portfolio-dashboard.visual.spec.ts
          done
      - name: Commit replayed canonical references to this verification branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/closing-price-linux-baselines
          python3 -I - <<'PY_CHECK'
          import pathlib, re, subprocess
          paths = set()
          for cmd in (["git", "diff", "--name-only", "-z"], ["git","ls-files","--others","--exclude-standard","-z","--","e2e"]):
              paths.update(x.decode() for x in subprocess.check_output(cmd).split(b"\0") if x)
          assert len(paths) <= 6, paths
          total = 0
          for name in sorted(paths):
              assert re.fullmatch(r"e2e/portfolio-dashboard\.visual\.spec\.ts-snapshots/[a-z0-9-]+-linux\.png",name), name
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink(), name
              data = path.read_bytes()
              assert data.startswith(bytes.fromhex("89504e470d0a1a0a"))
              total += len(data)
              assert total <= 8 * 1024 * 1024
              subprocess.run(["git","add","--",name],check=True)
          print("Canonical references:",len(paths),"files,",total,"bytes")
          PY_CHECK
          if ! git diff --cached --quiet; then
            git -c user.name="Keel visual verification" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Capture verified Linux references for the closing-price journey"
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/codex/closing-price-linux-baselines
          fi
