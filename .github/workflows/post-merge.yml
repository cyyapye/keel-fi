name: Post-merge Verification and Preview Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Exact merged commit
    needs:
      - secret-scan
      - tugling-contract
    uses: ./.github/workflows/native-verification.yml

  secret-scan:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, keel-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          HOME: ${{ runner.workspace }}

  tugling-contract:
    name: Tugling project contract
    runs-on: [self-hosted, Linux, X64, keel-ci]
    timeout-minutes: 5
    steps:
      - name: Check out the exact merged Keel commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Check out the accepted Tugling revision
        uses: actions/checkout@v5
        with:
          repository: cyyapye/tugling
          ref: 01af7eda080d3ef49d9fabcb7dfdf40e949a693c
          path: .tugling/checkouts/pinned
          persist-credentials: false
      - name: Verify the project adapter and privacy boundary
        run: >-
          python3
          .tugling/checkouts/pinned/plugins/tugling/scripts/project_contract.py
          --repo . --source-root .tugling/checkouts/pinned --source-mode pinned

  deploy-preview:
    name: Deploy exact SHA to preview
    if: github.ref == 'refs/heads/main'
    needs:
      - verify
      - secret-scan
      - tugling-contract
    runs-on: [self-hosted, Linux, X64, keel-deploy]
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      deployments: write
    environment:
      name: preview
      url: ${{ vars.KEEL_PREVIEW_URL }}
    concurrency:
      group: keel-preview-deployment
      cancel-in-progress: false
    env:
      KEEL_PREVIEW_BACKUP_NAME:
        preview-d1-backup-${{ github.sha }}-attempt-${{ github.run_attempt }}
      KEEL_PREVIEW_BACKUP_BUCKET: ${{ vars.KEEL_PREVIEW_BACKUP_BUCKET }}
      KEEL_PREVIEW_URL: ${{ vars.KEEL_PREVIEW_URL }}
    steps:
      - name: Check out the exact verified SHA
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Confirm exact main SHA
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Configure private runner paths
        shell: bash
        run: |
          {
            echo "KEEL_D1_MAINTENANCE_RECEIPT_PATH=$RUNNER_TEMP/keel-maintenance-admission.json"
            echo "KEEL_API_WRANGLER_OUTPUT_PATH=$RUNNER_TEMP/keel-api-deploy.jsonl"
            echo "KEEL_PREVIEW_BACKUP_ENCRYPTED_PATH=$RUNNER_TEMP/keel-preview-$GITHUB_SHA.sql.gpg"
            echo "KEEL_PREVIEW_BACKUP_MANIFEST_PATH=$RUNNER_TEMP/keel-preview-$GITHUB_SHA.backup.json"
            echo "KEEL_PREVIEW_BACKUP_STORAGE_RECEIPT_PATH=$RUNNER_TEMP/keel-preview-$GITHUB_SHA.storage.json"
            echo "KEEL_PREVIEW_BACKUP_PLAINTEXT_PATH=$RUNNER_TEMP/keel-preview-$GITHUB_SHA.sql"
            echo "KEEL_PREVIEW_BACKUP_VERIFY_PATH=$RUNNER_TEMP/keel-preview-$GITHUB_SHA.verify.sql"
            echo "KEEL_PREVIEW_RELEASE_EVIDENCE_PATH=$RUNNER_TEMP/keel-preview-$GITHUB_SHA.release.json"
            echo "KEEL_WEB_WRANGLER_OUTPUT_PATH=$RUNNER_TEMP/keel-web-deploy.jsonl"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node-pnpm
      - name: Prove populated migration cost on the exact revision
        env:
          KEEL_MIGRATION_SAFETY_RECEIPT:
            ${{ runner.temp }}/keel-migration-safety.json
        run: |
          pnpm exec tsx scripts/d1-migration-safety.ts check
          pnpm exec vitest run scripts/populated-migration-d1-cost.test.ts --maxWorkers=1
      - name: Admit and execute bounded D1 maintenance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEEL_PREVIEW_ACCESS_AUD: ${{ secrets.KEEL_PREVIEW_ACCESS_AUD }}
          KEEL_PREVIEW_ACCESS_CLIENT_ID:
            ${{ secrets.KEEL_PREVIEW_ACCESS_CLIENT_ID }}
          KEEL_PREVIEW_ACCESS_CLIENT_SECRET:
            ${{ secrets.KEEL_PREVIEW_ACCESS_CLIENT_SECRET }}
          KEEL_PREVIEW_ACCESS_TEAM_DOMAIN:
            ${{ secrets.KEEL_PREVIEW_ACCESS_TEAM_DOMAIN }}
          KEEL_PREVIEW_API_WORKER: ${{ secrets.KEEL_PREVIEW_API_WORKER }}
          KEEL_PREVIEW_PLAID_CASH_USAGE_PLAN:
            ${{ vars.KEEL_PREVIEW_PLAID_CASH_USAGE_PLAN }}
          KEEL_PREVIEW_BACKUP_PASSPHRASE:
            ${{ secrets.KEEL_PREVIEW_BACKUP_PASSPHRASE }}
          KEEL_PREVIEW_D1_ID: ${{ secrets.KEEL_PREVIEW_D1_ID }}
          KEEL_PREVIEW_D1_NAME: ${{ secrets.KEEL_PREVIEW_D1_NAME }}
          KEEL_PREVIEW_DEPLOYMENT_SMOKE_TOKEN:
            ${{ secrets.KEEL_PREVIEW_DEPLOYMENT_SMOKE_TOKEN }}
          KEEL_PREVIEW_CONNECTOR_CREDENTIAL_KEY:
            ${{ secrets.KEEL_PREVIEW_CONNECTOR_CREDENTIAL_KEY }}
          KEEL_PREVIEW_PLAID_CLIENT_ID:
            ${{ secrets.KEEL_PREVIEW_PLAID_CLIENT_ID }}
          KEEL_PREVIEW_PLAID_ENVIRONMENT:
            ${{ secrets.KEEL_PREVIEW_PLAID_ENVIRONMENT }}
          KEEL_PREVIEW_PLAID_REDIRECT_URI:
            ${{ secrets.KEEL_PREVIEW_PLAID_REDIRECT_URI }}
          KEEL_PREVIEW_PLAID_SECRET: ${{ secrets.KEEL_PREVIEW_PLAID_SECRET }}
          KEEL_PREVIEW_BRAVE_SEARCH_API_KEY:
            ${{ secrets.KEEL_PREVIEW_BRAVE_SEARCH_API_KEY }}
          KEEL_PREVIEW_QUEUE: ${{ secrets.KEEL_PREVIEW_QUEUE }}
          KEEL_PREVIEW_QUEUE_DLQ: ${{ secrets.KEEL_PREVIEW_QUEUE_DLQ }}
          KEEL_PREVIEW_R2_BUCKET: ${{ secrets.KEEL_PREVIEW_R2_BUCKET }}
          KEEL_PREVIEW_WEB_WORKER: ${{ secrets.KEEL_PREVIEW_WEB_WORKER }}
          KEEL_PREVIEW_D1_CAPACITY_BUCKET:
            ${{ secrets.KEEL_PREVIEW_D1_CAPACITY_BUCKET }}
          KEEL_PREVIEW_D1_CAPACITY_KEY:
            ${{ secrets.KEEL_PREVIEW_D1_CAPACITY_KEY }}
          KEEL_D1_MAINTENANCE_PLAN: ${{ secrets.KEEL_D1_MAINTENANCE_PLAN }}
          KEEL_D1_QUOTA_R2_CONFIG: ${{ secrets.KEEL_D1_QUOTA_R2_CONFIG }}
          KEEL_D1_QUOTA_KEY: ${{ secrets.KEEL_D1_QUOTA_KEY }}
          KEEL_MIGRATION_SAFETY_RECEIPT:
            ${{ runner.temp }}/keel-migration-safety.json
        run: pnpm exec tsx scripts/d1-maintenance.ts release
      - name: Remove private runner files
        if: always()
        run: |
          rm -f -- \
            apps/api/wrangler.preview.jsonc \
            apps/web/wrangler.preview.jsonc \
            "$KEEL_API_WRANGLER_OUTPUT_PATH" \
            "$KEEL_PREVIEW_BACKUP_ENCRYPTED_PATH" \
            "$KEEL_PREVIEW_BACKUP_MANIFEST_PATH" \
            "$KEEL_PREVIEW_BACKUP_STORAGE_RECEIPT_PATH" \
            "$RUNNER_TEMP/keel-preview-api-secrets.json" \
            "$RUNNER_TEMP/keel-preview-backup-passphrase" \
            "$KEEL_PREVIEW_BACKUP_PLAINTEXT_PATH" \
            "$KEEL_PREVIEW_BACKUP_VERIFY_PATH" \
            "$KEEL_PREVIEW_RELEASE_EVIDENCE_PATH" \
            "$KEEL_WEB_WRANGLER_OUTPUT_PATH" \
            "$RUNNER_TEMP/keel-migration-safety.json" \
            "$RUNNER_TEMP/keel-maintenance-admission.json"
