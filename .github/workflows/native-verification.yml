name: Native verification

on:
  workflow_call:
    inputs:
      layout_plan:
        description: Verified partial plan from the draft PR selector.
        type: string
        default: ""
    outputs:
      receipt:
        description: Complete validated native receipt for this attempt
        value: ${{ jobs.required.outputs.receipt }}

permissions:
  contents: read
  actions: read

jobs:
  required:
    name:
      ${{ inputs.layout_plan == '' && 'Complete native gate' || 'Layout draft
      native checks' }}
    runs-on: [self-hosted, Linux, X64, keel-ci]
    timeout-minutes: 65
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    defaults:
      run:
        working-directory: keel
    env:
      KEEL_SCREENSHOT_MODE: canonical
      TUGLING_PILOT_SOURCE: ${{ github.workspace }}/tugling-candidate
      TUGLING_VERIFICATION_ENVIRONMENT: keel-linux-x64-node22.13.0-pnpm11.9.0-parallel-v7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: keel
          fetch-depth: ${{ inputs.layout_plan == '' && 1 || 0 }}
          persist-credentials: false
      - name: Assert exact event revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify the layout draft event and trusted base policy
        if: inputs.layout_plan != ''
        env:
          ELIGIBLE_DRAFT: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.draft &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.base.repo.full_name == github.repository
            && github.event.pull_request.head.repo.full_name ==
            github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$ELIGIBLE_DRAFT" = true
          test "$(git --no-replace-objects show -s --format=%P HEAD)" = "$BASE_SHA $HEAD_SHA"
          git --no-replace-objects diff --quiet --no-ext-diff "$BASE_SHA" HEAD -- scripts/ci-draft-plan.py scripts/ci-draft-checks.py scripts/tugling-pilot.py
      - uses: actions/checkout@v5
        with:
          repository: cyyapye/tugling
          ref: 01af7eda080d3ef49d9fabcb7dfdf40e949a693c
          path: tugling-candidate
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0
          package_json_file: keel/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml
      - run: make bootstrap-ci
      - name: Check dedicated CI browser ports before expensive verification
        run: |
          node --import tsx --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { createServer } from "node:net";
          import { BROWSER_TEST_EXECUTION } from "./scripts/browser-test-lanes.ts";

          const [low, high] = readFileSync("/proc/sys/net/ipv4/ip_local_port_range", "utf8").trim().split(/\s+/).map(Number);
          const ports = Object.values(BROWSER_TEST_EXECUTION).flatMap(({ webPort, apiPort }) => apiPort === null ? [webPort] : [webPort, apiPort]);
          if (new Set(ports).size !== ports.length) throw new Error("Browser lanes share ports");
          const servers = [];
          try {
            for (const port of ports) {
              if (port >= low && port <= high) throw new Error(`Browser port ${port} overlaps ephemeral range ${low}-${high}`);
              const server = createServer();
              servers.push(server);
              await new Promise((resolve, reject) => server.once("error", reject).listen(port, "127.0.0.1", resolve));
              console.log(`Browser port ${port} is available and outside the ephemeral range`);
            }
          } finally {
            for (const server of servers) server.close();
          }
          JS
      - name: Execute the layout draft plan
        if: inputs.layout_plan != ''
        env:
          DRAFT_PLAN: ${{ inputs.layout_plan }}
        run: |
          test "$(git --no-replace-objects rev-parse HEAD)" = "$GITHUB_SHA"
          git --no-replace-objects diff --quiet --no-ext-diff HEAD --
          printf '%s\n' "$DRAFT_PLAN" | python3 -I scripts/ci-draft-checks.py --layout-plan-stdin
      - name: Execute each required native suite once
        if: inputs.layout_plan == ''
        run: |
          mkdir -p .tugling/local
          python3 scripts/ci-resource-sampler.py > .tugling/local/ci-resources.jsonl &
          resource_sampler_pid=$!
          trap 'kill "$resource_sampler_pid" 2>/dev/null || true; wait "$resource_sampler_pid" 2>/dev/null || true' EXIT
          make pilot-verify > .tugling/local/pilot-required.json
      - name: Validate and publish the complete receipt
        if: inputs.layout_plan == ''
        id: receipt
        run: python3 -I scripts/ci-verification.py publish
      - uses: ./keel/.github/actions/upload-bounded-artifact
        if: inputs.layout_plan == ''
        with:
          paused: ${{ vars.KEEL_PAUSE_ARTIFACT_UPLOADS || 'false' }}
          kind: receipt
          status: ${{ job.status }}
          name: native-required-${{ github.sha }}-${{ github.run_attempt }}
          path: .tugling/local/verification/required.json
      - name: Package bounded native diagnostics
        id: diagnostics
        if: always() && inputs.layout_plan == ''
        env:
          DIAGNOSTIC_STATUS: ${{ job.status }}
        run: python3 -I scripts/ci-diagnostics.py --status "$DIAGNOSTIC_STATUS"
      - name: Retain native diagnostics
        if:
          ${{ always() && inputs.layout_plan == '' && steps.diagnostics.outcome
          == 'success' }}
        uses: ./keel/.github/actions/upload-bounded-artifact
        with:
          paused: ${{ vars.KEEL_PAUSE_ARTIFACT_UPLOADS || 'false' }}
          kind: diagnostics
          status: ${{ job.status }}
          name: native-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: .tugling/local/ci-upload/diagnostics.zip
