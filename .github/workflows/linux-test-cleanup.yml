name: Linux test cleanup
on:
  push:
    paths:
      - scripts/linux-test-run.py
      - scripts/test_linux_test_run.py
      - .github/workflows/linux-test-cleanup.yml
  pull_request:
    paths:
      - scripts/linux-test-run.py
      - scripts/test_linux_test_run.py
      - .github/workflows/linux-test-cleanup.yml
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 scripts/test_linux_test_run.py
