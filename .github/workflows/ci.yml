name: PR Checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: [self-hosted, Linux, X64, keel-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - run: make check

  migrations:
    name: D1 migration and synthetic seed
    runs-on: [self-hosted, Linux, X64, keel-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: make db-verify

  browser:
    name: Critical browser flows
    runs-on: [self-hosted, Linux, X64, keel-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec playwright install chromium
      - run: make e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, keel-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
