name: PR Checks

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        edited,
      ]
  merge_group:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Complete native pilot gate
    needs: secret-scan
    uses: ./.github/workflows/native-verification.yml

  quality:
    name: Quality
    needs: native
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64, keel-ci]
    timeout-minutes: 5
    steps:
      - name: Require successful native execution
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: keel
          persist-credentials: false
      - uses: ./keel/.github/actions/verify-native-receipt
        with:
          receipt: ${{ needs.native.outputs.receipt }}

  migrations:
    name: D1 migration and synthetic seed
    needs: native
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64, keel-ci]
    timeout-minutes: 5
    steps:
      - name: Require successful native execution
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: keel
          persist-credentials: false
      - uses: ./keel/.github/actions/verify-native-receipt
        with:
          receipt: ${{ needs.native.outputs.receipt }}

  browser:
    name: Critical browser flows
    needs: native
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64, keel-ci]
    timeout-minutes: 5
    steps:
      - name: Require successful native execution
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: keel
          persist-credentials: false
      - uses: ./keel/.github/actions/verify-native-receipt
        with:
          receipt: ${{ needs.native.outputs.receipt }}

  secret-scan:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, keel-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          HOME: ${{ runner.workspace }}
      - name: Report proposed draft checks
        if:
          github.event_name == 'pull_request' && github.event.pull_request.draft
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$(git show -s --format=%P HEAD)" != "$BASE_SHA $HEAD_SHA" ]]; then
            echo 'The PR merge parents could not be verified. Run full verification.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          plan=$(python3 -I scripts/ci-draft-plan.py --base "$BASE_SHA" --head "$HEAD_SHA")
          printf 'Proposed draft checks (shadow only)\n\n```json\n%s\n```\n' "$plan" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan"

  draft-history-shadow:
    name: Historical draft selection shadow
    needs: [secret-scan, quality, migrations, browser]
    if: >-
      !cancelled() && needs.secret-scan.result == 'success' && github.event_name
      == 'pull_request' && github.event.pull_request.number == 340 &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.run_attempt == '1'
    runs-on: [self-hosted, Linux, X64, keel-ci]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: reviewed-shadow
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 0239c79e26d883c1afd93e47d4dc16fa7b29aabc
          path: historical-334
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 951c473d5605a204386e465512fcfddb010e570b
          path: historical-184
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0
          package_json_file: historical-334/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Replay the original PR 334 SQLite selection
        working-directory: historical-334
        run: |
          node scripts/check-toolchain.mjs
          pnpm install --frozen-lockfile
          python3 -I ../reviewed-shadow/scripts/ci-draft-shadow.py 334
      - name: Replay the original PR 184 prose selection
        working-directory: historical-184
        run: |
          node scripts/check-toolchain.mjs
          pnpm install --frozen-lockfile
          python3 -I ../reviewed-shadow/scripts/ci-draft-shadow.py 184
