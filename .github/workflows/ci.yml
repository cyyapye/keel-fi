name: PR Checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Complete native pilot gate
    uses: ./.github/workflows/native-verification.yml

  quality:
    name: Quality
    needs: native
    if: always()
    runs-on: [self-hosted, Linux, X64, keel-ci]
    timeout-minutes: 5
    steps:
      - name: Require successful native execution
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: keel
          persist-credentials: false
      - uses: ./keel/.github/actions/verify-native-receipt

  migrations:
    name: D1 migration and synthetic seed
    needs: native
    if: always()
    runs-on: [self-hosted, Linux, X64, keel-ci]
    timeout-minutes: 5
    steps:
      - name: Require successful native execution
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: keel
          persist-credentials: false
      - uses: ./keel/.github/actions/verify-native-receipt

  browser:
    name: Critical browser flows
    needs: native
    if: always()
    runs-on: [self-hosted, Linux, X64, keel-ci]
    timeout-minutes: 5
    steps:
      - name: Require successful native execution
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: keel
          persist-credentials: false
      - uses: ./keel/.github/actions/verify-native-receipt

  secret-scan:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, keel-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOME: ${{ runner.workspace }}
