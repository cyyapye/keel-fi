name: Tugling candidate pilot

on:
  workflow_dispatch:
    inputs:
      isolated_browser:
        description:
          Time the complete browser suite on its own for a CI comparison
        type: boolean
        default: false
      regression_probe:
        description:
          Run the polling regression rejection probe instead of the complete
          passing gate
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: tugling-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name:
      ${{ inputs.isolated_browser && 'Isolated browser timing diagnostic' ||
      inputs.regression_probe && 'Polling regression rejection probe' ||
      'Complete native pilot gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes:
      ${{ (inputs.regression_probe || inputs.isolated_browser) && 30 || 120 }}
    defaults:
      run:
        working-directory: keel
    env:
      KEEL_SCREENSHOT_MODE: canonical
      TUGLING_VERIFICATION_ENVIRONMENT: keel-gh-ubuntu24-x64-node22.13.0-pnpm11.9.0-parallel-v8
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      TUGLING_PILOT_SOURCE: ${{ github.workspace }}/tugling-candidate
    steps:
      - name: Reject conflicting diagnostic modes
        if: ${{ inputs.isolated_browser && inputs.regression_probe }}
        working-directory: ${{ github.workspace }}
        run: exit 1
      - name: Check out exact PR head or merge-queue candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: keel
          persist-credentials: false
      - name: Assert intended project revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Check out reviewed candidate as a sibling
        uses: actions/checkout@v5
        with:
          repository: cyyapye/tugling
          ref: 01af7eda080d3ef49d9fabcb7dfdf40e949a693c
          path: tugling-candidate
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0
          package_json_file: keel/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml
      - name: Prepare locked dependencies and Chromium
        run: make bootstrap-ci
      - name: Prepare disposable native runtime
        timeout-minutes: 15
        run: python3 -I scripts/ci-disposable-linux.py
      - name: Execute complete required gate on this revision
        if: ${{ !inputs.regression_probe && !inputs.isolated_browser }}
        run: |
          mkdir -p .tugling/local
          make pilot-verify > .tugling/local/pilot-required.json
      - name: Inspect current required receipt
        if: ${{ !inputs.regression_probe && !inputs.isolated_browser }}
        run: |
          receipt=$(python3 -I -c 'import json; print(json.load(open(".tugling/local/pilot-required.json"))["flow_verification"]["path"])')
          python3 -I scripts/tugling-pilot.py evidence "$receipt"
      - name: Prove the required gate rejects increased idle polling
        if: ${{ inputs.regression_probe }}
        run: python3 -I scripts/pilot_regression_probe.py
      - name: Prepare the canonical browser build and synthetic seed
        if: ${{ inputs.isolated_browser }}
        run: |
          make build
          python3 -I scripts/pilot_native.py migration-seed
          python3 -I scripts/pilot_native.py browser-fixture
      - name: Time the complete browser process
        if: ${{ inputs.isolated_browser }}
        timeout-minutes: 5
        run: |
          python3 -I - <<'PY'
          import os, subprocess, sys, time
          start = time.monotonic()
          result = subprocess.run([sys.executable, '-I', 'scripts/pilot_native.py', 'playwright-prepared'])
          elapsed = time.monotonic() - start
          print(f"Isolated browser phase at {os.environ['GITHUB_SHA']}: {elapsed:.3f}s, exit {result.returncode}", flush=True)
          if elapsed > 300:
              sys.exit("Browser verification exceeded its 300-second budget")
          sys.exit(result.returncode)
          PY
      - name: Package bounded pilot diagnostics
        id: diagnostics
        if: ${{ always() && !inputs.isolated_browser }}
        env:
          DIAGNOSTIC_STATUS: ${{ job.status }}
        run: python3 -I scripts/ci-diagnostics.py --status "$DIAGNOSTIC_STATUS"
      - name: Retain synthetic verification evidence
        if: ${{ always() && steps.diagnostics.outcome == 'success' }}
        uses: ./keel/.github/actions/upload-bounded-artifact
        with:
          paused: ${{ vars.KEEL_PAUSE_ARTIFACT_UPLOADS || 'false' }}
          kind: diagnostics
          status: ${{ job.status }}
          name:
            native-pilot-${{ github.event.pull_request.head.sha || github.sha
            }}-${{ github.run_attempt }}
          path: .tugling/local/ci-upload/diagnostics.zip
